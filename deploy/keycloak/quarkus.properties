# Mounted into /opt/keycloak/conf for local development only.
# Browsers send all localhost cookies to every port, so the web app's and Aspire dashboard's
# cookies also reach Keycloak. Raise the request header limits to avoid HTTP 431.
# HTTP/1.1 limit:
quarkus.http.limits.max-header-size=64K
# HTTP/2 limit (what browsers use over https):
quarkus.http.limits.max-header-list-size=65536
