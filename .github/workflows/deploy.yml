name: deploy

# Manual-only until the VPS exists (Hetzner postponed). To enable auto-deploy after CI,
# restore the workflow_run trigger below. Requires repo secrets:
#   VPS_HOST, VPS_USER, VPS_SSH_KEY (deploy user's private key)
on:
  workflow_dispatch:
  # workflow_run:
  #   workflows: [ci]
  #   types: [completed]
  #   branches: [main]

concurrency: deploy-production

jobs:
  images:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { project: RelayDesk.Api, image: relay-api }
          - { project: RelayDesk.Realtime, image: relay-realtime }
          - { project: RelayDesk.AiWorker, image: relay-ai-worker }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          build-args: PROJECT=${{ matrix.project }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.event.workflow_run.head_sha || github.sha }}

  release:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Sync deploy files
        run: |
          rsync -az --exclude .env.example deploy/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/relaydesk/"
      - name: Roll out
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd /opt/relaydesk && sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=${{ github.event.workflow_run.head_sha || github.sha }}/' .env \
             && docker compose pull && docker compose up -d --remove-orphans && docker image prune -f"
      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            curl -fsS "https://${{ vars.DOMAIN }}/alive" && exit 0
            sleep 6
          done
          exit 1
