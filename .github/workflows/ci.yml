name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore RelayDesk.slnx
      - run: dotnet build RelayDesk.slnx -c Release --no-restore -warnaserror
      # Integration tests use Testcontainers (Docker is available on ubuntu-latest).
      - run: dotnet test RelayDesk.slnx -c Release --no-build --logger trx

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          AUTH_SECRET: ci-only-not-a-secret
