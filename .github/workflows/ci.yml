name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore RelayDesk.slnx
      - run: dotnet build RelayDesk.slnx -c Release --no-restore -warnaserror
      - run: dotnet test RelayDesk.slnx -c Release --no-build --logger trx
