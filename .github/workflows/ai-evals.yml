name: ai-evals

# Quality gate for AI features (ADR 0008): runs the eval suite against real local models whenever
# prompts, retrieval, AI code or the dataset change. Slower than CI (model download), so it is separate.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/Modules/RelayDesk.Modules.Ai/**
      - src/Modules/RelayDesk.Modules.KnowledgeBase/**
      - src/RelayDesk.SharedKernel/Ai/**
      - tests/RelayDesk.Evals/**

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      ollama:
        image: ollama/ollama:0.12.3
        ports: ["11434:11434"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Pull models (about 2.3 GB)
        run: |
          for model in nomic-embed-text llama3.2:3b; do
            curl -fsS http://localhost:11434/api/pull -d "{\"model\":\"$model\",\"stream\":false}" > /dev/null
          done
      - run: dotnet test tests/RelayDesk.Evals -c Release --logger "console;verbosity=normal"
        env:
          RELAYDESK_EVAL_OLLAMA: http://localhost:11434
